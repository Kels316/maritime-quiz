<!doctype html><meta charset="utf-8"><title>visual gallery</title>
<style>body{font:12px sans-serif;background:#fff;margin:8px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}svg{width:100%;height:auto}</style>
<div class="g" id="g"></div>
<script src="../js/engine.js"></script><script src="../js/visuals.js"></script><script src="../js/generators.js"></script>
<script>
const V=MQV.render, out=document.getElementById('g');
['port','stbd','N','S','E','W','isolated','safe','special','wreck'].forEach(t=>out.innerHTML+='<div>'+t+V({k:'buoy',t})+'</div>');
[['red','red'],['red','white','red'],['red','red','red'],['green','white'],['red','white'],['white','red'],['white','red','red']].forEach(s=>out.innerHTML+='<div>'+V({k:'lights',stack:s})+'</div>');
[['ball','ball'],['ball','diamond','ball'],['cylinder'],['cone_down','cone_up'],['cone_down'],['ball','ball','ball'],['diamond']].forEach(s=>out.innerHTML+='<div>'+V({k:'shapes',stack:s})+'</div>');
for(let i=0;i<6;i++){const q=MQ.genInstance('aspect',['g',i]);out.innerHTML+='<div>'+V(q.vis)+'</div>';}
for(let i=0;i<6;i++){const q=MQ.genInstance('encounter',['h',i]);out.innerHTML+='<div>'+V(q.vis)+'<small>'+q.q.slice(60,160)+'</small></div>';}
</script>
